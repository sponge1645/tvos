<!doctype html><html lang="{{LANG}}"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>tvOS · iCloud</title>
<style>body{margin:0;background:#10151e;color:#f5f7fa;font:17px system-ui,sans-serif;display:grid;place-items:center;min-height:100svh}main{max-width:440px;width:calc(100% - 48px);padding:32px 0}h1{font-size:32px;margin:0 0 12px}p{line-height:1.5;color:#b8c4d3}label{display:block;margin:26px 0 10px}input,button{box-sizing:border-box;width:100%;padding:15px;border-radius:12px;font:inherit}input{border:1px solid #5c708d;background:#1b2636;color:white}button{margin-top:16px;border:0;background:#dcecff;color:#14233b;font-weight:600;cursor:pointer}button:disabled{opacity:.5}#status{min-height:54px}small{color:#a9b6c8}</style>
<main><h1 id="title"></h1><p id="help"></p><form id="form"><label for="link" id="label"></label><input id="link" type="url" autocomplete="off" autocapitalize="off" spellcheck="false" required maxlength="4096" placeholder="https://www.icloud.com/sharedalbum/#…"><button id="save" type="submit"></button></form><p id="status" role="status" aria-live="polite"></p><small id="note"></small></main>
<script nonce="{{NONCE}}">
const ru=document.documentElement.lang==='ru';const t=ru?{title:'Фото iCloud',help:'Вставьте публичную ссылку на общий альбом iCloud. Вход в Apple Account не нужен.',label:'Ссылка на альбом',save:'Подключить альбом',busy:'Проверяем альбом…',ok:'Альбом подключён. Фотографии доступны для заставки на телевизоре.',error:'Не удалось открыть альбом. Проверьте ссылку и включите публичный доступ к альбому.',network:'Соединение с телевизором прервано. Проверьте результат на ТВ; при необходимости откройте форму заново.',note:'Фото останутся в вашем iCloud. Телевизор сохранит копии для заставки.'}:{title:'iCloud Photos',help:'Paste a public iCloud Shared Album link. No Apple Account sign-in is needed.',label:'Album link',save:'Connect album',busy:'Checking the album…',ok:'Album connected. Photos are available for the TV screen saver.',error:'Could not open the album. Check the link and enable public access to the album.',network:'Connection to the TV was interrupted. Check the result on your TV; reopen this form if needed.',note:'Photos stay in your iCloud. The TV caches copies for the screen saver.'};for(const id of ['title','help','label','save','note'])document.getElementById(id).textContent=t[id];
document.getElementById('form').addEventListener('submit',async event=>{event.preventDefault();const button=document.getElementById('save'),status=document.getElementById('status');button.disabled=true;status.textContent=t.busy;try{const response=await fetch('{{UPLOAD_PATH}}',{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:document.getElementById('link').value.trim()});if(!response.ok)throw new Error('album');status.textContent=t.ok;document.getElementById('form').hidden=true;}catch(error){status.textContent=error.message==='album'?t.error:t.network;button.disabled=false;}});
</script></html>
