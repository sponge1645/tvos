<!doctype html><html lang="{{LANG}}"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>tvOS</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#151a22;color:#f5f5f7;font:17px system-ui,-apple-system,sans-serif;text-align:center;min-height:100svh;padding:36px 22px}main{max-width:420px;margin:auto}h1{font-size:30px;line-height:1.15;margin:24px 0 32px}button{display:block;border:0;border-radius:18px;padding:18px;width:100%;margin:12px 0;font:600 18px system-ui;background:#fff;color:#17202c}button.secondary{background:#303744;color:#fff}button:disabled{opacity:.45}input[type=file]{display:none}#crop{display:none}#preview{width:min(100%,360px);aspect-ratio:1;border-radius:50%;border:2px solid #ffffff80;touch-action:none;display:block;margin:0 auto 24px;background:#222}#zoom{width:100%;margin:8px 0 24px;accent-color:#fff}#message{min-height:48px;color:#c5cbd5;line-height:1.5}small{color:#a9b2c2}#done{display:none;font-size:24px;padding-top:30px}
</style><main><h1 id="heading"></h1><section id="pick"><button id="library"></button><button id="camera" class="secondary"></button><input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif"><input id="shot" type="file" accept="image/*" capture="user"></section><section id="crop"><canvas id="preview" width="512" height="512"></canvas><small id="hint"></small><input id="zoom" type="range" min="1" max="4" value="1" step=".01" aria-label="Zoom"><button id="save"></button><button id="cancel" class="secondary"></button></section><p id="message" role="status"></p><div id="done"></div></main>
<script nonce="{{NONCE}}">
'use strict';
const ru=document.documentElement.lang==='ru',t=ru?{heading:'Загрузите свой аватар',library:'Загрузить фото',camera:'Сделать снимок',hint:'Перемещайте фото и выберите масштаб',save:'Сохранить аватар',cancel:'Выбрать другое фото',error:'Не удалось использовать это фото. Выберите другое.',sending:'Сохраняем…',done:'Готово! Аватар появился на телевизоре.'}:{heading:'Upload your avatar',library:'Upload photo',camera:'Take a photo',hint:'Move the photo and adjust its size',save:'Save avatar',cancel:'Choose another photo',error:'This photo could not be used. Choose another one.',sending:'Saving…',done:'Done! Your avatar is now on the TV.'};
const $=id=>document.getElementById(id);for(const id of ['heading','library','camera','hint','save','cancel','done'])$(id).textContent=t[id];
const canvas=$('preview'),ctx=canvas.getContext('2d',{alpha:false});let image=null,url='',scale=1,dx=0,dy=0,drag=null,selection=0;
$('library').onclick=()=>$('file').click();$('camera').onclick=()=>$('shot').click();
function draw(){if(!image)return;const base=Math.max(512/image.naturalWidth,512/image.naturalHeight)*scale,w=image.naturalWidth*base,h=image.naturalHeight*base;dx=Math.max(-(w-512)/2,Math.min((w-512)/2,dx));dy=Math.max(-(h-512)/2,Math.min((h-512)/2,dy));ctx.fillStyle='#fff';ctx.fillRect(0,0,512,512);ctx.drawImage(image,(512-w)/2+dx,(512-h)/2+dy,w,h);}
async function choose(file){if(!file)return;const id=++selection;$('message').textContent='';if(!file||!file.size||file.size>2097152||!/^image\/(jpeg|png|webp|heic|heif)$/i.test(file.type)){$('message').textContent=t.error;return;}const candidate=URL.createObjectURL(file),img=new Image();img.onload=()=>{if(id!==selection){URL.revokeObjectURL(candidate);return;}if(url)URL.revokeObjectURL(url);url=candidate;image=img;scale=1;dx=dy=0;$('zoom').value=1;$('pick').style.display='none';$('crop').style.display='block';draw();};img.onerror=()=>{URL.revokeObjectURL(candidate);if(id===selection)$('message').textContent=t.error;};img.src=candidate;}
for(const id of ['file','shot'])$(id).onchange=e=>{choose(e.target.files[0]);e.target.value='';};
$('zoom').oninput=e=>{scale=+e.target.value;draw();};canvas.onpointerdown=e=>{canvas.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,dx,dy};};canvas.onpointermove=e=>{if(!drag)return;const ratio=512/canvas.getBoundingClientRect().width;dx=drag.dx+(e.clientX-drag.x)*ratio;dy=drag.dy+(e.clientY-drag.y)*ratio;draw();};canvas.onpointerup=canvas.onpointercancel=()=>{drag=null;};
$('cancel').onclick=()=>{selection++;if(url)URL.revokeObjectURL(url);url='';image=null;$('crop').style.display='none';$('pick').style.display='block';$('message').textContent='';};
$('save').onclick=()=>{if(!image)return;$('save').disabled=true;$('cancel').disabled=true;$('message').textContent=t.sending;canvas.toBlob(async blob=>{try{if(!blob||blob.size>2097152)throw Error();const response=await fetch(location.pathname+'upload',{method:'POST',headers:{'Content-Type':'image/jpeg'},body:blob,cache:'no-store'});if(!response.ok)throw Error();$('crop').style.display='none';$('message').textContent='';$('done').style.display='block';if(url)URL.revokeObjectURL(url);image=null;}catch(_){$('message').textContent=t.error;$('save').disabled=false;$('cancel').disabled=false;}},'image/jpeg',.92);};
</script></html>
